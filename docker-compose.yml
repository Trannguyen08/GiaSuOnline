version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "5050:80"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    env_file: .env
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  django:
    build: 
      context: ./backend
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - ./backend:/app
    # No ports exposed to host, accessible via Nginx on 8000
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  channels:
    build:
      context: ./backend
    command: daphne -b 0.0.0.0 -p 8001 config.asgi:application
    volumes:
      - ./backend:/app
    ports:
      - "8001:8001"
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: ./backend
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./backend:/app
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
      - "8443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./backend/staticfiles:/app/staticfiles
      - ./backend/media:/app/media
      - frontend_static:/usr/share/nginx/html:ro
    depends_on:
      - django
      - frontend

  frontend:
    build:
      context: ./frontend
    # Build and copy files to shared volume
    command: sh -c "npm run build && cp -r dist/* /usr/share/nginx/html/"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - frontend_static:/usr/share/nginx/html
    env_file: .env

volumes:
  postgres_data:
  redis_data:
  frontend_static:
