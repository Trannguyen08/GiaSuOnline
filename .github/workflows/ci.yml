name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tutormatch
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: strongpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements/development.txt
    - name: Lint with flake8
      run: flake8 backend/
    - name: Check format with black
      run: black --check backend/
    - name: Security scan with bandit
      run: bandit -r backend/ -x backend/venv,backend/.venv,backend/**/migrations -s B105,B110,B310,B311
    - name: Test with pytest
      env:
        DATABASE_URL: postgresql://postgres:strongpassword@localhost:5432/tutormatch
        REDIS_URL: redis://localhost:6379/0
        SECRET_KEY: test-secret-key-min-50-chars-for-testing
        DJANGO_SETTINGS_MODULE: config.settings.development
      run: |
        cd backend
        pytest --cov=apps --cov=core
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
